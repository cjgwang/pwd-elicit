[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pwd-elicit"
version = "1.0.0"
description = "Password-locked LLM chat application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
    "bcrypt>=4.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    # ML stack — comment out if you only need auth/session tests
    "transformers>=4.40.0",
    "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",      # required by FastAPI TestClient
]

[project.scripts]
pwd-elicit = "src.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
